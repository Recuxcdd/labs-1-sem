<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Flask App</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
        form { margin-bottom: 30px; border: 1px solid #ccc; padding: 15px; border-radius: 8px; }
        input { display: block; width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #60c544; color: white; border: none; cursor: pointer; }
        .entries-container { border-top: 2px solid #eee; margin-top: 20px; }
        .entry-item { padding: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <h2>Добавить запись</h2>
    <form method="POST">
        <input type="text" name="town" placeholder="Город" required>
        <input type="text" name="visit_date" placeholder="Дата посещения" required>
        <button type="submit">Отправить</button>
    </form>

     <form action="{{ url_for('clear_db') }}" method="POST">
        <button type="submit" style="background-color: #cf0026; margin-top: 10px;">Очистить базу</button>
    </form>

    <div class="entries-container">
        <h3>Записи в базе:</h3>
        {% for entry in entries %}
            <div class="entry-item">
                <strong>{{ entry.id }}</strong>: {{ entry.town }} | {{ entry.visit_date }}
            </div>
        {% endfor %}
    </div>

</body>
</html>
